font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 10.0

disable_ligatures always


window_padding_width 5

cursor_shape underline


# Cores geradas a partir do tema do Quickshell (quickshell/tools/theme-sync-terminal.py).
# O arquivo é recriado a cada troca de tema e o kitty recarrega sozinho (SIGUSR1).
include ~/.local/state/quickshell/kitty-theme.conf
